name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Sync mygo.json version to tag
        run: |
          python3 - <<PY
          import json, os
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          p = "cmd/fdl-app/mygo.json"
          cfg = json.load(open(p))
          cfg["version"] = tag
          json.dump(cfg, open(p, "w"), indent=2, ensure_ascii=False)
          PY
      - run: go test ./... -count=1
      - name: CLI suite (tar.gz ×4 + checksums + install.sh)
        run: ./scripts/release.sh "$GITHUB_REF_NAME" dist
      - name: fdl.app + DMG + signed update manifests
        working-directory: cmd/fdl-app
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_LDFLAGS: -X github.com/nightgopher/fdl-go.Version=${{ github.ref_name }}
        run: |
          go run github.com/egoist/mygo/cmd/mygo@v0.9.0 build \
            -platform darwin/universal,linux/amd64,linux/arm64
          for f in dist/*/*; do cp "$f" ../../dist/ 2>/dev/null || true; done
          # 只收安装器与更新 manifest，别把 .app 目录摊平进 dist
          rm -rf ../../dist/fdl.app
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "fdl-go $GITHUB_REF_NAME" \
            --generate-notes
